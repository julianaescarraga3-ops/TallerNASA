<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/styles.css">
    <title>Explorador astronómico</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark cosmic-navbar">
            <div class="container">
                <a class="navbar-brand cosmic-brand" href="#">
                    APOD
                </a>
                <a class="nav-link cosmic-nav-link" href="#favoritos">
                    Mis favoritos
                </a>
            </div>
        </nav>
    </header>
    <main class="container py-4 py-lg-5">
        <section class="search-panel mb-4" aria-labelledby="search-title">
            <div class="row align-items-end g-3">
                <div class="col-12 col-md">
                    <label for="fecha" class="form-label" id="search-title">
                        Explorar por fecha
                    </label>
                    <input
                        type="date"
                        class="form-control cosmic-input"
                        id="fecha"
                        min="1995-06-16"
                        required
                    >
                </div>
                <div class="col-12 col-md-auto">
                    <button
                        type="button"
                        class="btn btn-cosmic w-100"
                        id="btnBuscar"
                    >
                        Buscar
                    </button>
                </div>
            </div>

            <p class="search-hint mt-3 mb-0">
                Desde el 16 de junio de 1995 hasta la fecha actual.
            </p>
        </section>
        <div
            id="mensaje"
            class="alert cosmic-alert d-none"
            role="status"
            aria-live="polite"
        ></div>
        <section id="seccionApod" aria-labelledby="tituloApod">
            <article class="apod-card">
                <div class="apod-image-container">
                    <img
                        id="imagenApod"
                        class="apod-image"
                        src=""
                        alt=""
                        hidden
                    >
                </div>
                <div class="apod-content">
                    <p class="eyebrow mb-2" id="fechaApod"></p>
                    <h2 id="tituloApod" class="apod-title">
                        Explorando el universo
                    </h2>
                    <div class="apod-actions">
                        <button
                            type="button"
                            class="btn btn-cosmic"
                            id="btnFavorito"
                            disabled
                        >
                            Guardar en favoritos
                        </button>
                        <a
                            id="enlaceVideo"
                            class="btn btn-outline-cosmic d-none"
                            href="#"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Ver el video en NASA ↗
                        </a>
                    </div>
                    <div class="explanation-container mt-4">
                        <h3 class="explanation-heading">
                            Sobre este descubrimiento
                        </h3>
                        <div id="explicacion" class="apod-explanation">
                            La explicación científica aparecerá aquí.
                        </div>
                    </div>
                    <p id="fuenteApod" class="source-link mt-4 mb-0"></p>
                </div>
            </article>
        </section>
        <section
            id="favoritos"
            class="favorites-section mt-5 pt-4"
            aria-labelledby="tituloFavoritos"
        >
            <div class="section-heading mb-3">
                <h2 id="tituloFavoritos" class="h5 mb-3">
                    Mi favoritos
                </h2>
            </div>
            <div id="listaFavoritos" class="row g-3">
            </div>
            <p id="favoritosVacios" class="empty-favorites">
                Todavía no tienes favoritos...
            </p>
        </section>
        <footer class="cosmic-footer mt-5 pt-4">
            <p>Agregar linkedin de los integrantes</p>
        </footer>
    </main>
    <script src="node_modules/dayjs/dayjs.min.js"></script>
    <script src="node_modules/dayjs/locale/es.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
